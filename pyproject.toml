[project]
name = "example"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "mypy>=2.4.0",
    "pandas>=3.0.6",
    "defusedxml>=0.7.1",
    "ruff>=0.16.10",
]

# [build-system]
# requires = ["hatchling"]  # the tool that build .whl
# build-backend = "hatchling.build"

# [tool.hatch.build.targets.wheel]
# packages = ["src/example"]

[tool.mypy]
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
explicit_package_bases = true
mypy_path = "src"
plugins = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unknown_data"]

[project.scripts]
unknown-data = "unknown_data.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pandas-stubs>=3", "types-defusedxml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
